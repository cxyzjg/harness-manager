<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness-manager 控制面</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e37; --fg:#e6e8eb; --muted:#9aa0a8; --accent:#4f8cff; --green:#3fb950; --red:#f85149; --yellow:#d29922; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; }
  header .badge { font-size:12px; color:var(--muted); }
  nav { display:flex; gap:4px; padding:8px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:none; border:none; color:var(--muted); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  nav button.active { background:var(--card); color:var(--fg); }
  nav button:hover { background:var(--card); }
  main { padding:20px 24px; max-width:1200px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card .num { font-size:28px; font-weight:700; }
  .card .label { font-size:12px; color:var(--muted); margin-top:4px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:15px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  tr:hover td { background:#20242c; }
  code { background:#242933; padding:2px 6px; border-radius:4px; font-size:12px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; }
  .tag.green { background:#1b3321; color:var(--green); }
  .tag.yellow { background:#33290f; color:var(--yellow); }
  .tag.red { background:#3d1d1d; color:var(--red); }
  .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
  .trace { font-family:ui-monospace,Consolas,monospace; font-size:12px; line-height:1.7; white-space:pre-wrap; background:#161a20; border-radius:8px; padding:12px; max-height:500px; overflow:auto; }
  .muted { color:var(--muted); }
  .bar { background:#242933; border-radius:4px; height:8px; overflow:hidden; margin-top:4px; }
  .bar > div { background:var(--accent); height:100%; }
  .error { color:var(--red); }
  .op { background:#242933; border:1px solid var(--line); color:var(--fg); padding:3px 8px; border-radius:6px; font-size:11px; cursor:pointer; margin-right:4px; }
  .op:hover { border-color:var(--accent); color:var(--accent); }
  .active-tab { border-color:var(--accent) !important; color:var(--accent) !important; }
  a { color:var(--accent); text-decoration:none; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > .panel { flex:1; min-width:280px; }
</style>
</head>
<body>
<header>
  <h1>🛰️ harness-manager</h1>
  <span class="badge">跨 Agent 资源 / 会话 / 调用链 控制面</span>
</header>
<nav id="nav">
  <button data-page="dashboard" class="active">仪表盘</button>
  <button data-page="resources">资源</button>
  <button data-page="sessions">会话</button>
  <button data-page="dedupe">去重候选</button>
  <button data-page="token">Token 趋势</button>
  <button data-page="stats">统计</button>
  <button data-page="outcome">会话成效</button>
  <button data-page="health">技能健康</button>
  <button data-page="live">实时</button>
</nav>
<main id="main">
  <div class="cards" id="cards"></div>
  <div id="content"></div>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
const api = async (p) => (await fetch(p)).json();
const toast = (msg) => {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;bottom:24px;right:24px;background:#2d333b;border:1px solid var(--line);color:var(--fg);padding:12px 18px;border-radius:10px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:400px;font-size:13px";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.style.display = "none"), 5000);
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (n) => (n ?? 0).toLocaleString();
const tag = (t) => `<span class="tag ${t}">${t}</span>`;
const statusTag = (s, migratedTo) => {
  const map = {
    active: ["green", "active"],
    candidate: ["yellow", "候选"],
    "duplicate-of": ["red", "重复"],
    "superseded-by": ["red", "被取代"],
    migrated: ["green", `已迁→${esc(migratedTo || "单源")}`],
  };
  const [c, label] = map[s] || ["", s];
  return `<span class="tag ${c}">${esc(label)}</span>`;
};

async function loadDashboard() {
  const d = await api("/api/dashboard");
  $("#cards").innerHTML = [
    { n: d.resources, l: "资源 (skills/工具/扩展)" },
    { n: d.sessions, l: "会话" },
    { n: fmt(d.tokens), l: "token 总量" },
    { n: d.totalMessages, l: "消息数" },
    { n: d.dupes, l: "去重候选组" },
  ].map((c) => `<div class="card"><div class="num">${c.n}</div><div class="label">${c.l}</div></div>`).join("");
  const src = Object.entries(d.bySource || {}).map(([k,v]) => `${esc(k)}: ${v}`).join(" · ");
  $("#content").innerHTML = `
    <div class="panel"><h2>资源来源分布</h2><p class="muted">${esc(src) || "无数据"}</p></div>
    <div class="panel"><h2>去重候选 (Top)</h2>
      ${d.dupeGroups?.length ? d.dupeGroups.map((g) => `<div class="muted">• ${esc(g)}</div>`).join("") : `<p class="muted">无</p>`}
    </div>`;
}

async function loadResources() {
  const r = await api("/api/resources");
  const rows = r.map((x) => `<tr>
    <td><input type="checkbox" class="res-sel" value="${esc(x.id)}"></td>
    <td>${esc(x.name)}</td>
    <td>${tag(x.kind)}</td>
    <td>${esc(x.source)}:${esc(x.scope)}</td>
    <td>${statusTag(x.status, x.migratedTo)}</td>
    <td class="muted">${esc((x.description||"").slice(0,60))}</td>
    <td>
      <button class="op" data-id="${esc(x.id)}" data-name="${esc(x.name)}" title="标记为重复/被取代(记录决策)" onclick="applyRes('disable',this)">停用</button>
      <button class="op" data-id="${esc(x.id)}" data-name="${esc(x.name)}" title="恢复为正常使用" onclick="applyRes('enable',this)">启用</button>
      <button class="op" data-id="${esc(x.id)}" data-name="${esc(x.name)}" title="复制到仓库 skills/ 供多端共享" onclick="applyRes('move',this)">迁单源</button>
    </td>
  </tr>`).join("");
  $("#content").innerHTML = `<div class="panel"><h2>资源清单 (${r.length})</h2>
    <div style="margin:8px 0;display:flex;gap:8px;align-items:center">
      <button class="op" onclick="toggleSel()">全选</button>
      <button class="op" onclick="batchMove()">⬆ 一键迁移选中到单源</button>
      <button class="op" onclick="batchDisable()">⛔ 批量停用选中</button>
      <button class="op" onclick="checkNewSkills()">🆕 检测新技能</button>
      <span class="muted" style="font-size:12px" id="sel-count">已选 0</span>
    </div>
    <div id="new-skill-panel"></div>
    <table><thead><tr><th></th><th>名称</th><th>类型</th><th>来源:归属</th><th>状态</th><th>描述</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function selectedIds() {
  return [...document.querySelectorAll(".res-sel:checked")].map((el) => el.value);
}

async function checkNewSkills() {
  const panel = document.getElementById("new-skill-panel");
  const d = await fetch("/api/onboard", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) }).then((r) => r.json());
  const cs = d.candidates || [];
  if (!cs.length) {
    panel.innerHTML = `<div class="panel" style="border-color:var(--green)"><h2>🆕 新技能检测</h2><p class="muted">无新技能，单源已全部托管 ${d.singleSourceCount ?? 0} 个技能 ✓</p></div>`;
    return;
  }
  const list = cs.map((c) => `<label style="display:block;margin:3px 0"><input type="checkbox" class="ns-sel" value="${esc(c.name)}" checked> ${esc(c.name)} <span class="muted">→ ${esc(c.path)}</span></label>`).join("");
  panel.innerHTML = `<div class="panel" style="border-color:var(--yellow)"><h2>🆕 发现 ${cs.length} 个新技能（未在单源共享）</h2>
    <div>${list}</div>
    <button class="op" style="margin-top:8px;padding:6px 14px" onclick="migrateNewSkills()">⬆ 迁移选中到单源</button>
  </div>`;
}

async function migrateNewSkills() {
  const names = [...document.querySelectorAll(".ns-sel:checked")].map((el) => el.value);
  if (!names.length) return toast("请先勾选要迁移的技能");
  if (!confirm(`将把 ${names.length} 个技能复制到单源共享 skills/。确认?`)) return;
  const r = await fetch("/api/onboard", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ names, confirm: true }) }).then((x) => x.json());
  toast(`✓ 已迁移 ${(r.migrated || []).length} 个技能到单源`);
  document.getElementById("new-skill-panel").innerHTML = "";
  loadResources();
}

function toggleSel() {
  const all = document.querySelectorAll(".res-sel");
  const any = [...all].some((el) => el.checked);
  all.forEach((el) => (el.checked = !any));
  document.getElementById("sel-count").textContent = `已选 ${selectedIds().length}`;
}

async function batchMove() {
  const ids = selectedIds();
  if (!ids.length) return toast("请先勾选要迁移的资源");
  const plan = await fetch("/api/batch-move", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids }) }).then((r) => r.json());
  const n = (plan.planned || []).length;
  if (!confirm(`将把 ${n} 个资源复制到单源目录 skills/（源保留）。\n\n确认批量迁移?`)) return;
  await fetch("/api/batch-move", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids, confirm: true }) });
  toast(`✓ 已迁移 ${n} 个资源到单源`);
  loadResources();
}

async function batchDisable() {
  const ids = selectedIds();
  if (!ids.length) return toast("请先勾选要停用的资源");
  const reason = prompt("批量停用理由? (duplicate-of:xxx / superseded-by:xxx)") || "batch-disable";
  for (const id of ids) {
    const plan = await fetch("/api/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ req: { type: "disable", resourceId: id, reason } }) }).then((r) => r.json());
    if (!plan.planned?.[0]?.actions) continue;
  }
  if (!confirm(`将标记 ${ids.length} 个资源为停用(重复/被取代)。确认?`)) return;
  for (const id of ids) {
    await fetch("/api/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ req: { type: "disable", resourceId: id, reason }, confirm: true }) });
  }
  toast(`✓ 已停用 ${ids.length} 个资源`);
  loadResources();
}

async function loadSessions() {
  const s = await api("/api/sessions");
  const rows = s.map((x) => `<tr>
    <td><a href="#" onclick="showSession('${esc(x.id)}');return false;" class="mono">${esc(x.id.slice(0,20))}</a></td>
    <td>${esc(x.harness)}</td>
    <td>${esc((x.startedAt||"").slice(0,16))}</td>
    <td>${x.messages}</td>
    <td>${x.tools.length}</td>
    <td>${x.tokenUsage ? fmt(x.tokenUsage.total) : "—"}</td>
    <td class="muted">${esc(x.cwd)}</td>
  </tr>`).join("");
  $("#content").innerHTML = `<div class="panel"><h2>会话列表 (${s.length}) — 点击 id 查看调用链</h2>
    <table><thead><tr><th>id</th><th>harness</th><th>时间</th><th>消息</th><th>工具</th><th>token</th><th>项目</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function showSession(id) {
  const s = await api("/api/sessions/" + encodeURIComponent(id));
  if (!s || s.error) return ($("#content").innerHTML = `<p class="error">未找到</p>`);
  let treeTxt;
  try {
    treeTxt = renderTreeText(s.tree, 0);
  } catch { treeTxt = s.tools.map((t,i) => `${i+1}. ${t.name}`).join("\n"); }
  cachedSessionTree[id] = treeTxt;
  $("#content").innerHTML = `
    <button onclick="loadSessions()" style="background:none;border:none;color:var(--accent);cursor:pointer;margin-bottom:10px">← 返回</button>
    <div class="panel"><h2>会话 ${esc(s.id)}</h2>
      <p class="muted">${esc(s.harness)} · ${esc(s.cwd)} · ${s.messages} 消息 · ${s.tools.length} 次工具调用${s.tokenUsage ? " · token " + fmt(s.tokenUsage.total) : ""}</p>
      <div style="display:flex;gap:8px;margin:10px 0">
        <button class="op active-tab" id="tab-story" onclick="showStory('${esc(s.id)}')">🧠 执行轨迹+思考</button>
        <button class="op" id="tab-tree" onclick="showTree('${esc(s.id)}')">🔗 调用链</button>
      </div>
      <div id="session-view"><div class="trace">${esc(treeTxt)}</div></div>
    </div>`;
}

async function showStory(id) {
  document.getElementById("tab-story").classList.add("active-tab");
  document.getElementById("tab-tree").classList.remove("active-tab");
  const d = await api("/api/sessions/" + encodeURIComponent(id) + "/story");
  const story = d.story || [];
  const html = story.map((n) => {
    if (n.kind === "thinking") {
      return `<div style="margin:8px 0;padding:8px 12px;border-left:3px solid var(--yellow);background:#1b1f27;border-radius:6px"><div class="muted" style="font-size:11px">💭 思考</div><div style="font-size:13px;line-height:1.6;color:#d8c48a">${esc(n.detail)}</div></div>`;
    }
    const kids = (n.children || []).map((c) => `    <div style="color:var(--muted);font-size:12px">└─ ${esc(c.label)} ${esc(c.toolInput||"")}</div>`).join("");
    const out = n.toolOutput ? `<div class="muted" style="font-size:11px;margin-left:16px">↩ ${esc(n.toolOutput)}</div>` : "";
    return `<div style="margin:4px 0"><span style="color:var(--accent)">🛠 ${esc(n.label)}</span> ${esc(n.toolInput||"")}${kids}${out}</div>`;
  }).join("");
  document.getElementById("session-view").innerHTML = `<div style="max-height:70vh;overflow:auto">${html || "<p class='muted'>无轨迹数据</p>"}</div>`;
}

function showTree(id) {
  document.getElementById("tab-story").classList.remove("active-tab");
  document.getElementById("tab-tree").classList.add("active-tab");
  document.getElementById("session-view").innerHTML = `<div class="trace">${esc(cachedSessionTree[id] || "（无调用）")}</div>`;
}

const cachedSessionTree = {};

function renderTreeText(nodes, depth) {
  if (!nodes?.length) return "（无调用）";
  let out = "";
  const walk = (n, d) => {
    const pad = "  ".repeat(d);
    const dur = n.call?.durationMs != null ? ` [${n.call.durationMs}ms]` : "";
    out += `${pad}${n.call?.name}${dur}\n`;
    n.children?.forEach((c) => walk(c, d + 1));
  };
  nodes.forEach((n) => walk(n, depth));
  return out;
}

async function loadDedupe() {
  const d = await api("/api/dedupe");
  const resources = await api("/api/resources");
  // name@source → resource id（用于一键去重）
  const idOf = (ns) => {
    const [name, srcScope] = ns.split("@");
    const [source, scope] = (srcScope || "").split(":");
    const hit = resources.find((r) => r.name === name && r.source === source && (r.scope === scope || !scope));
    return hit ? hit.id : null;
  };
  const groups = d.map((g, gi) => {
    const ids = g.names.map(idOf).filter(Boolean);
    const keepSel = g.names.map((n) => {
      const id = idOf(n);
      return `<label style="display:block;margin:2px 0"><input type="radio" name="keep-${gi}" value="${esc(id)}" ${gi === 0 ? "checked" : ""}> ${esc(n)}</label>`;
    }).join("");
    return `<div class="panel"><h2>${g.kind === "same-name" ? "同名冲突" : "功能重叠"} — ${esc(g.reason)}</h2>
      <div style="margin:8px 0">${g.names.map((n) => `<span class="tag yellow" style="margin-right:6px">${esc(n)}</span>`).join("")}</div>
      <div style="flex:1"><b class="muted">保留为主用:</b>${keepSel}</div>
      <button class="op" style="margin-top:10px;padding:6px 14px" onclick="dedupeGroup(${gi})">⚡ 一键去重这组</button>
    </div>`;
  });
  $("#content").innerHTML = `<p class="muted" style="margin-bottom:10px">选中每组的“主用”技能，点击一键去重：自动保留主用 + 将其他标记为重复 + 写决策记录。</p>` + (groups.join("") || `<p class="muted">未发现去重候选</p>`);
}

async function dedupeGroup(gi) {
  const d = await api("/api/dedupe");
  const resources = await api("/api/resources");
  const idOf = (ns) => {
    const [name, srcScope] = ns.split("@");
    const [source, scope] = (srcScope || "").split(":");
    const hit = resources.find((r) => r.name === name && r.source === source && (r.scope === scope || !scope));
    return hit ? hit.id : null;
  };
  const g = d[gi];
  const ids = g.names.map(idOf).filter(Boolean);
  const keepId = document.querySelector(`input[name="keep-${gi}"]:checked`)?.value;
  // dry-run
  const plan = await fetch("/api/dedupe-apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids, keepId }) }).then((r) => r.json());
  const actions = (plan.planned || []).map((p) => p.actions.map((a) => "  • " + a).join("\n")).join("\n");
  if (!confirm(`一键去重将执行:\n${actions}\n\n确认?`)) return;
  await fetch("/api/dedupe-apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids, keepId, confirm: true }) });
  toast("✓ 去重完成，已写决策记录");
  loadDedupe();
}

async function loadToken() {
  const t = await api("/api/trend");
  const max = Math.max(1, ...Object.values(t.byProject||{}).map((v) => v.input));
  const proj = Object.entries(t.byProject||{}).sort((a,b)=>b[1].input-a[1].input).map(([k,v]) => `
    <div style="margin-bottom:10px"><div>${esc(k)} <span class="muted">(${v.sessions} 会话, in=${fmt(v.input)} out=${fmt(v.output)})</span></div>
    <div class="bar"><div style="width:${(v.input/max*100).toFixed(1)}%"></div></div></div>`).join("");
  const model = Object.entries(t.byModel||{}).sort((a,b)=>b[1].input-a[1].input).map(([k,v]) => `
    <div>${esc(k)}: <span class="muted">${v.sessions} 会话 in=${fmt(v.input)}</span></div>`).join("");
  $("#content").innerHTML = `
    <div class="row">
      <div class="panel"><h2>按项目 token (in)</h2>${proj || '<p class="muted">无 token 数据</p>'}</div>
      <div class="panel"><h2>按模型</h2>${model || '<p class="muted">无</p>'}</div>
    </div>
    <div class="panel"><h2>总量</h2><p>in=${fmt(t.totalInput)} out=${fmt(t.totalOutput)} total=${fmt(t.total)}</p></div>`;
}

async function loadStats() {
  const st = await api("/api/stats");
  const cs = st.cs || {}, ts = st.ts || {};
  const toolBars = (ts.topTools||[]).slice(0,10).map((t,i) => `
    <div style="margin-bottom:6px"><span>${esc(t.name)}</span> <span class="muted">×${t.count}</span></div>`).join("");
  $("#content").innerHTML = `
    <div class="row">
      <div class="panel"><h2>上下文规模</h2>
        <p>${cs.totalSessions} 会话 · ${cs.totalMessages} 消息 · 平均 ${cs.avgMessagesPerSession}/会话</p>
        <p class="muted">估算 token ≈ ${fmt(cs.estimatedTotalTokens)}</p>
        <h3 style="margin:12px 0 8px">大会话 Top</h3>
        ${(cs.largeSessions||[]).map((s)=>`<div>${s.messages} 消息 — ${esc(s.cwd)}</div>`).join("")}
      </div>
      <div class="panel"><h2>工具频率 Top</h2>${toolBars || '<p class="muted">无</p>'}</div>
    </div>`;
}

const pages = { dashboard: loadDashboard, resources: loadResources, sessions: loadSessions, dedupe: loadDedupe, token: loadToken, stats: loadStats, outcome: loadOutcome, health: loadHealth, live: loadLive };

async function loadLive() {
  const s = await api("/api/live");
  if (!s.active) {
    $("#content").innerHTML = `<div class="panel"><h2>⚡ 实时监控</h2>
      <p class="muted">实时监控未启用。需要将 <code>extensions/realtime.ts</code> 注册为 pi 扩展，
      它会把正在发生的工具调用写入 <code>~/.harness-manager/realtime/events.log</code>。</p></div>`;
    return;
  }
  const top1h = Object.entries(s.window1h?.byTool || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const max = Math.max(1, ...top1h.map(([, v]) => v));
  const bars = top1h.map(([k, v]) => `<div style="margin:6px 0"><span>${esc(k)}</span> <span class="muted">×${v}</span>
    <div class="bar"><div style="width:${(v / max * 100).toFixed(1)}%"></div></div></div>`).join("");
  const events = (s.recent || []).map((e) => {
    const t = (e.ts || "").slice(11, 19);
    if (e.type === "tool_call") return `<div style="margin:3px 0"><span class="muted">${t}</span> 🛠 <b>${esc(e.toolName)}</b> <span class="muted">${esc((e.input && JSON.stringify(e.input) || "").slice(0, 60))}</span></div>`;
    if (e.type === "session_start") return `<div style="margin:3px 0"><span class="muted">${t}</span> ▶ 会话开始 <span class="muted">${esc(e.cwd || "")}</span></div>`;
    return `<div style="margin:3px 0"><span class="muted">${t}</span> ■ 会话结束</div>`;
  }).join("");
  $("#content").innerHTML = `
    <div class="row">
      <div class="panel"><h2>最近 1h 工具调用 (${s.window1h?.toolCalls ?? 0})</h2>${bars || '<p class="muted">无</p>'}</div>
      <div class="panel"><h2>活跃会话 (${(s.activeSessions || []).length})</h2>${(s.activeSessions || []).slice(0, 6).map((x) => `<div>• ${esc(x.slice(0, 40))}</div>`).join("") || '<p class="muted">无</p>'}</div>
    </div>
    <div class="panel"><h2>实时事件流</h2><div style="max-height:400px;overflow:auto">${events || '<p class="muted">暂无事件</p>'}</div></div>
    <p class="muted" style="font-size:11px">日志: ${esc(s.logPath)} · ${s.logSize} bytes · 自动刷新</p>`;
  // 每 3 秒自动刷新
  setTimeout(() => { if (document.querySelector("nav button.active")?.dataset.page === "live") loadLive(); }, 3000);
}

async function loadOutcome() {
  const o = await api("/api/outcome");
  const rows = o.map((x) => `<tr>
    <td>${x.level === "high" ? "🟢" : x.level === "medium" ? "🟡" : "🔴"} <b>${x.score}</b></td>
    <td>${esc(x.harness)}</td>
    <td><a href="#" onclick="showSession('${esc(x.sessionId)}');return false;" class="mono">${esc(x.sessionId.slice(0,20))}</a></td>
    <td class="muted">${esc((x.startedAt||"").slice(0,10))}</td>
    <td class="muted">${esc((x.project||"").slice(0,40))}</td>
    <td>${x.metrics.toolCalls}调/${x.metrics.messageCount}msg/tok${fmt(x.metrics.tokenTotal)}/写${x.metrics.writeActions}/错${x.metrics.errors}/重${x.metrics.retries}</td>
    <td class="muted">${esc(x.signals.slice(0,2).join("; "))}</td>
  </tr>`).join("");
  const high = o.filter((x) => x.level === "high").length;
  const med = o.filter((x) => x.level === "medium").length;
  const low = o.filter((x) => x.level === "low").length;
  $("#content").innerHTML = `<div class="panel"><h2>会话成效评估 (${o.length})</h2>
    <p class="muted">🟢 高 ${high} · 🟡 中 ${med} · 🔴 低 ${low} — 点击会话 id 查看调用链</p>
    <table><thead><tr><th>分</th><th>harness</th><th>会话</th><th>日期</th><th>项目</th><th>指标</th><th>判断</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function loadHealth() {
  const d = await api("/api/health");
  const h = d.health || [];
  const s = d.summary || {};
  const rows = h.map((x) => `<tr>
    <td>${x.level === "healthy" ? "🟢" : x.level === "attention" ? "🟡" : "🔴"} <b>${x.score}</b></td>
    <td>${esc(x.resource.name)}</td>
    <td>${esc(x.resource.source)}:${esc(x.resource.scope)}</td>
    <td>${esc(x.resource.status)}</td>
    <td class="muted">${esc(x.issues.join("; ") || "-")}</td>
    <td class="muted">${esc(x.actions.join("; ") || "-")}</td>
  </tr>`).join("");
  $("#content").innerHTML = `<div class="panel"><h2>技能健康监控 (${h.length})</h2>
    <p class="muted">🟢 健康 ${s.byLevel?.healthy ?? 0} · 🟡 需关注 ${s.byLevel?.attention ?? 0} · 🔴 风险 ${s.byLevel?.risk ?? 0}</p>
    <table><thead><tr><th>健康分</th><th>技能</th><th>来源</th><th>状态</th><th>问题</th><th>维护建议</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function applyRes(type, btn) {
  const id = btn.dataset.id, name = btn.dataset.name;
  const labels = {
    disable: `停用 \`${name}\` = 标记为重复/被取代（记录决策，不删文件）`,
    enable: `启用 \`${name}\` = 恢复为正常使用(active)`,
    move: `迁单源 \`${name}\` = 复制到仓库 skills/ 供多端共享（源保留）`,
  };
  const reason = type === "disable" ? (prompt(`停用 ${name}，理由? (duplicate-of:xxx / superseded-by:xxx)`) || "duplicate/superseded") : undefined;
  // 1) dry-run
  const plan = await fetch("/api/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ req: { type, resourceId: id, reason, target: name } }) }).then((r) => r.json());
  const actions = plan.planned?.[0]?.actions || [];
  const msg = `${labels[type]}\n\n将执行:\n${actions.map((a) => "  • " + a).join("\n")}\n\n确认执行?`;
  if (!confirm(msg)) return;
  // 2) 确认执行
  const res = await fetch("/api/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ req: { type, resourceId: id, reason, target: name }, confirm: true }) }).then((r) => r.json());
  if (res.executed) {
    toast(type === "disable" ? `✓ 已停用 ${name}（写决策+标记状态）` : type === "enable" ? `✓ 已启用 ${name}` : `✓ 已迁移 ${name} 到单源`);
  } else {
    toast("✗ 操作未执行");
  }
  loadResources();
}

$("#nav").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#nav button").forEach((x) => x.classList.remove("active"));
  b.classList.add("active");
  pages[b.dataset.page]();
});

loadDashboard();
</script>
